apiVersion: v1
kind: Namespace
metadata:
  name: coworking-booking
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coworking-booking-config
  namespace: coworking-booking
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"

  MongoDbSettings__DatabaseName: "CoworkingBookingDb"

  AWS__Region: "us-east-1"

  Seq__ServerUrl: "http://host.docker.internal:5341"

  Keycloak__Authority: "http://localhost:7080/realms/coworking-booking"
  Keycloak__Audience: "coworking-booking-api"
  Keycloak__MetadataAddress: "http://host.docker.internal:7080/realms/coworking-booking/.well-known/openid-configuration"